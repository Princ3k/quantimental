name: Publish Unusual Moves

# Scans the S&P 500 for stocks having unusual days and commits the result as a
# static JSON file, which the frontend fetches directly.
#
# Same reasoning as the Signal Desk workflow: the payload is identical for
# every viewer, so it is a file rather than a request. It also keeps a
# 503-ticker download off the critical path of somebody opening the page.

on:
  schedule:
    # Hourly during US market hours, plus once after the close, on weekdays.
    # The post-close run is the one that matters — it is the only scan of the
    # day that reads a completed session.
    #
    # Deliberately not on the hour. GitHub queues every scheduled workflow on
    # the planet at :00, and drops runs it cannot start in time rather than
    # running them late — which is how this went a full trading day without
    # firing once. Odd minutes sit outside that stampede. Changing these means
    # changing the `github.event.schedule` comparisons below, which are how the
    # post-close run is told apart from the hourly ones.
    - cron: '13 14-21 * * 1-5'
    - cron: '43 21 * * 1-5'
  workflow_dispatch:
    inputs:
      sweep_attention:
        description: >-
          Measure news coverage and write it to the archive. The sweep paces
          itself around Yahoo's limiter and takes about nine minutes, and the
          archive keeps one reading per trading day — so this belongs on the
          post-close run and nowhere else. A dispatch used to do it every time,
          which would have meant eight sweeps a day once the scans were
          triggered hourly from outside GitHub.
        type: boolean
        default: false

# Only this workflow may write, and only to push the generated file.
permissions:
  contents: write

concurrency:
  group: unusual-scan
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The attention sweep paces itself to stay under Yahoo's limiter, so the
    # post-close run is minutes rather than seconds. Bounded so a hung request
    # cannot hold the runner open.
    timeout-minutes: 30
    env:
      # EDGAR asks for a contact in the User-Agent and throttles traffic it
      # cannot trace. Not a secret — it is published with every request.
      SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # The attention archive lives in a private repository. It is the only
      # thing here that cannot be rebuilt from public sources, and a public git
      # log would publish it daily — permanently, since history cannot be
      # un-shared. Only the derived figures reach snapshot.json.
      #
      # continue-on-error: a missing or expired token must not stop the price
      # scan, which is the actual product. The step below degrades to a scan
      # without attention.
      - name: Check out the private data store
        id: data_store
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Princ3k/quantimental-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-store

      # A freshly created repository has no commits, so no refs/heads/main for
      # checkout to fetch — it fails with "couldn't find remote ref". That is a
      # state the store is guaranteed to be in exactly once, on the first run,
      # and requiring someone to hand-commit a README first is a setup step
      # nobody will remember. So the first run creates the branch itself.
      - name: Initialise the data store if it is empty
        id: data_store_init
        if: steps.data_store.outcome != 'success'
        continue-on-error: true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_REPO_TOKEN}" ]; then
            echo "::warning::DATA_REPO_TOKEN is not set; skipping the attention sweep."
            exit 1
          fi

          mkdir -p data-store
          cd data-store
          git init -q -b main
          git remote add origin \
            "https://x-access-token:${DATA_REPO_TOKEN}@github.com/Princ3k/quantimental-data.git"

          # An existing branch means checkout failed for some other reason —
          # a revoked token, a renamed repo — and quietly force-initialising
          # over real data would destroy the one thing this store holds.
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "::error::Data store has a main branch but checkout failed. Not overwriting."
            exit 1
          fi

          cat > README.md <<'EOF'
          # quantimental-data

          The attention archive for [Quantimental](https://github.com/Princ3k/quantimental):
          a daily record of how much news coverage each S&P 500 company was getting.

          Private because it is the one input that cannot be rebuilt from public
          sources — nobody sells historical news volume — and a public git log
          would republish it every day, permanently.

          Written by the `Publish Unusual Moves` workflow. Do not edit by hand.
          EOF

          echo "Initialised an empty data store."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Production deps only — no test runner needed to generate a file.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The news sweep takes about nine minutes and the archive keeps one
      # observation per trading day, so the eight hourly runs would spend the
      # same Yahoo budget overwriting the same row — and sweeping nine times a
      # day is how you get rate limited. Only the post-close run measures it.
      # Reads the archive without writing to it: publish_unusual.py carries the
      # last sweep's coverage forward and reports how many sessions are banked.
      # Without this the hourly runs looked at the default path, which does not
      # exist in the public checkout, so every one of them republished the
      # snapshot with no `v` and archive_days: 0 — wiping, within the hour, what
      # the post-close sweep had just measured.
      #
      # This condition is a first filter, not the guarantee. It cannot be: the
      # scan is triggered from two places, and a cron GitHub starts late still
      # matches its own schedule. publish_unusual.py makes the final call by
      # asking the archive whether this session is already measured, which is
      # the question that stays correct however late a trigger arrives.
      - name: Scan for unusual moves
        if: ${{ !(github.event.schedule == '43 21 * * 1-5' || inputs.sweep_attention) }}
        env:
          ATTENTION_ARCHIVE_PATH: ${{ github.workspace }}/data-store/attention-history.json
        run: python scripts/publish_unusual.py ../public/unusual.json --filings

      - name: Scan, and measure attention
        if: |
          (github.event.schedule == '43 21 * * 1-5' || inputs.sweep_attention)
          && (steps.data_store.outcome == 'success' || steps.data_store_init.outcome == 'success')
        env:
          ATTENTION_ARCHIVE_PATH: ${{ github.workspace }}/data-store/attention-history.json
        run: python scripts/publish_unusual.py ../public/unusual.json --attention --filings

      # The data store was unreachable — usually an expired token. Scan anyway;
      # coverage figures carry forward from the last successful sweep.
      - name: Scan without attention (data store unavailable)
        if: |
          (github.event.schedule == '43 21 * * 1-5' || inputs.sweep_attention)
          && steps.data_store.outcome != 'success'
          && steps.data_store_init.outcome != 'success'
        run: |
          echo "::warning::Private data store unreachable; skipping the attention sweep."
          python scripts/publish_unusual.py ../public/unusual.json --filings

      - name: Commit the archive to its private store
        if: steps.data_store.outcome == 'success' || steps.data_store_init.outcome == 'success'
        working-directory: data-store
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Archive unchanged."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: attention readings for $(date -u +%Y-%m-%d)"
          # -u so the very first push creates main and sets its upstream.
          git push -u origin main

      - name: Commit if the scan changed
        working-directory: .
        run: |
          # snapshot.json carries every measured ticker and backs the per-stock
          # pages, so it changes on almost every run even when the feed does not.
          if git diff --quiet -- public/unusual.json public/snapshot.json; then
            echo "No change in the scan; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Named once. The same list is needed four times below, and the last
          # time a published file moved, four stale paths were left behind in a
          # workflow and the publish broke for days.
          #
          # Left unquoted where it expands: these word-split into separate
          # arguments, and none of the paths contain spaces.
          publish_files="public/unusual.json public/snapshot.json"

          # Two publishers write this branch, and a scan can also race another
          # run of itself: github.sha is pinned when a run is created, so one
          # that queued behind another checks out a base that has already moved.
          #
          # The first attempt at this rebased, on the reasoning that the two
          # workflows write different files so nothing could conflict. That was
          # true across workflows and false for a workflow racing itself — both
          # runs regenerate the same file with a different timestamp, on the
          # same lines, and the rebase stopped on a conflict.
          #
          # These files are generated, never edited, so there is nothing to
          # merge. The newest scan is simply the one we want: take the freshest
          # main and replant our output on top of it.
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            git add $publish_files
            git commit -q -m "chore: update unusual moves [skip ci]" || true

            if git push; then
              exit 0
            fi

            echo "::notice::Push rejected (attempt $attempt of 5); replanting on the newest main."

            # Somewhere a hard reset cannot reach.
            mkdir -p "$RUNNER_TEMP/publish"
            # shellcheck disable=SC2086
            for f in $publish_files; do
              cp "$f" "$RUNNER_TEMP/publish/$(basename "$f")"
            done

            # Guarded deliberately. GitHub runs these blocks under `bash -e`, so
            # an unguarded fetch that fails takes the whole step down with git's
            # own exit code instead of trying again — which is how this died
            # with 128 on 2026-10-05, while the identical race half an hour
            # earlier merely exhausted its attempts. A refused or interrupted
            # fetch is a reason to retry, not to stop publishing.
            if git fetch origin main && git reset --hard origin/main; then
              # shellcheck disable=SC2086
              for f in $publish_files; do
                mkdir -p "$(dirname "$f")"
                cp "$RUNNER_TEMP/publish/$(basename "$f")" "$f"
              done
            else
              echo "::notice::Could not reach origin (attempt $attempt); keeping this tree and retrying."
            fi

            # Backing off matters more than it looks. Both publishers push this
            # branch on overlapping schedules, and on 2026-10-05 a single push
            # was taking around 200 seconds; three immediate retries lose the
            # same race three times.
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1

      # The sweep degrades quietly on purpose: a dead token must not take the
      # price scan down with it. But a green check and a `::warning::` nobody
      # reads is how the archive stops growing for a month without anyone
      # noticing, and it needs twenty unbroken trading days before it can say
      # anything. So the run publishes first and fails afterwards — the product
      # stays up, and GitHub sends the mail it only sends on failure.
      - name: Fail if the post-close run skipped the sweep
        if: |
          (github.event.schedule == '43 21 * * 1-5' || inputs.sweep_attention)
          && steps.data_store.outcome != 'success'
          && steps.data_store_init.outcome != 'success'
        run: |
          echo "::error::The attention sweep did not run: the private data store was unreachable."
          echo "Usually DATA_REPO_TOKEN has expired. The scan published without attention;"
          echo "coverage figures on the site are carrying forward from the last good sweep."
          exit 1

      # The sweep's other failure mode, and the one that actually happened.
      # Yahoo's news endpoint began returning an empty list on 2026-09-30: no
      # error, no exception, just nothing. The step still took its usual ~200s
      # walking 503 tickers, the run went green, and because coverage carries
      # forward the site kept serving the last good figures as though they were
      # current. Six trading days passed before anyone noticed.
      #
      # Same discipline as the step above: publish first, fail afterwards. The
      # product stays up and GitHub sends the mail it only sends on failure.
      - name: Fail if the sweep measured nothing
        if: |
          (github.event.schedule == '43 21 * * 1-5' || inputs.sweep_attention)
          && (steps.data_store.outcome == 'success' || steps.data_store_init.outcome == 'success')
        working-directory: .
        run: |
          python3 - <<'CHECK'
          import json, sys

          snapshot = json.load(open("public/snapshot.json"))
          session = snapshot["as_of"]
          measured = snapshot.get("coverage_measured")
          measured_on = snapshot.get("coverage_measured_on")
          universe = snapshot["count"]

          # record() refuses to write a session nothing was measured in, so a
          # sweep that reached nothing leaves the archive's newest date at the
          # *previous* session. That makes this comparison the exact test for
          # the failure above — no threshold, no judgement call.
          if measured_on != session:
              print(f"::error::The sweep recorded nothing for {session}; the archive "
                    f"still ends at {measured_on}. Yahoo's news endpoint is the usual "
                    f"cause — check attention_service._fetch_news against it.")
              sys.exit(1)

          # A sweep can also come back throttled rather than dead. Half the
          # universe is the line: below it the source is broken, above it the
          # sweep guard orders another attempt on the next run, and alarming on
          # ordinary throttling is how an alarm becomes one nobody reads.
          if measured < universe // 2:
              print(f"::error::The sweep reached only {measured} of {universe} tickers "
                    f"for {session}. That is too few to be throttling.")
              sys.exit(1)

          print(f"Sweep measured {measured} of {universe} tickers for {session}.")
          CHECK

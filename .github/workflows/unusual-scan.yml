name: Publish Unusual Moves

# Scans the S&P 500 for stocks having unusual days and commits the result as a
# static JSON file, which the frontend fetches directly.
#
# Same reasoning as the Signal Desk workflow: the payload is identical for
# every viewer, so it is a file rather than a request. It also keeps a
# 503-ticker download off the critical path of somebody opening the page.

on:
  schedule:
    # Hourly during US market hours, plus once after the close, on weekdays.
    # The post-close run is the one that matters — it is the only scan of the
    # day that reads a completed session.
    - cron: '0 14-21 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# Only this workflow may write, and only to push the generated file.
permissions:
  contents: write

concurrency:
  group: unusual-scan
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The attention sweep paces itself to stay under Yahoo's limiter, so the
    # post-close run is minutes rather than seconds. Bounded so a hung request
    # cannot hold the runner open.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # The attention archive lives in a private repository. It is the only
      # thing here that cannot be rebuilt from public sources, and a public git
      # log would publish it daily — permanently, since history cannot be
      # un-shared. Only the derived figures reach snapshot.json.
      #
      # continue-on-error: a missing or expired token must not stop the price
      # scan, which is the actual product. The step below degrades to a scan
      # without attention.
      - name: Check out the private data store
        id: data_store
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Princ3k/quantimental-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-store

      # A freshly created repository has no commits, so no refs/heads/main for
      # checkout to fetch — it fails with "couldn't find remote ref". That is a
      # state the store is guaranteed to be in exactly once, on the first run,
      # and requiring someone to hand-commit a README first is a setup step
      # nobody will remember. So the first run creates the branch itself.
      - name: Initialise the data store if it is empty
        id: data_store_init
        if: steps.data_store.outcome != 'success'
        continue-on-error: true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_REPO_TOKEN}" ]; then
            echo "::warning::DATA_REPO_TOKEN is not set; skipping the attention sweep."
            exit 1
          fi

          mkdir -p data-store
          cd data-store
          git init -q -b main
          git remote add origin \
            "https://x-access-token:${DATA_REPO_TOKEN}@github.com/Princ3k/quantimental-data.git"

          # An existing branch means checkout failed for some other reason —
          # a revoked token, a renamed repo — and quietly force-initialising
          # over real data would destroy the one thing this store holds.
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "::error::Data store has a main branch but checkout failed. Not overwriting."
            exit 1
          fi

          cat > README.md <<'EOF'
          # quantimental-data

          The attention archive for [Quantimental](https://github.com/Princ3k/quantimental):
          a daily record of how much news coverage each S&P 500 company was getting.

          Private because it is the one input that cannot be rebuilt from public
          sources — nobody sells historical news volume — and a public git log
          would republish it every day, permanently.

          Written by the `Publish Unusual Moves` workflow. Do not edit by hand.
          EOF

          echo "Initialised an empty data store."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Production deps only — no test runner needed to generate a file.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The news sweep takes about nine minutes and the archive keeps one
      # observation per trading day, so the eight hourly runs would spend the
      # same Yahoo budget overwriting the same row — and sweeping nine times a
      # day is how you get rate limited. Only the post-close run measures it.
      - name: Scan for unusual moves
        if: github.event.schedule != '30 21 * * 1-5'
        run: python scripts/publish_unusual.py ../public/unusual.json

      - name: Scan, and measure attention
        if: |
          (github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch')
          && (steps.data_store.outcome == 'success' || steps.data_store_init.outcome == 'success')
        env:
          ATTENTION_ARCHIVE_PATH: ${{ github.workspace }}/data-store/attention-history.json
        run: python scripts/publish_unusual.py ../public/unusual.json --attention

      # The data store was unreachable — usually an expired token. Scan anyway;
      # coverage figures carry forward from the last successful sweep.
      - name: Scan without attention (data store unavailable)
        if: |
          (github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch')
          && steps.data_store.outcome != 'success'
          && steps.data_store_init.outcome != 'success'
        run: |
          echo "::warning::Private data store unreachable; skipping the attention sweep."
          python scripts/publish_unusual.py ../public/unusual.json

      - name: Commit the archive to its private store
        if: steps.data_store.outcome == 'success' || steps.data_store_init.outcome == 'success'
        working-directory: data-store
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Archive unchanged."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: attention readings for $(date -u +%Y-%m-%d)"
          # -u so the very first push creates main and sets its upstream.
          git push -u origin main

      - name: Commit if the scan changed
        working-directory: .
        run: |
          # snapshot.json carries every measured ticker and backs the per-stock
          # pages, so it changes on almost every run even when the feed does not.
          if git diff --quiet -- public/unusual.json public/snapshot.json; then
            echo "No change in the scan; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/unusual.json public/snapshot.json
          git commit -m "chore: update unusual moves [skip ci]"
          git push

      # The sweep degrades quietly on purpose: a dead token must not take the
      # price scan down with it. But a green check and a `::warning::` nobody
      # reads is how the archive stops growing for a month without anyone
      # noticing, and it needs twenty unbroken trading days before it can say
      # anything. So the run publishes first and fails afterwards — the product
      # stays up, and GitHub sends the mail it only sends on failure.
      - name: Fail if the post-close run skipped the sweep
        if: |
          (github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch')
          && steps.data_store.outcome != 'success'
          && steps.data_store_init.outcome != 'success'
        run: |
          echo "::error::The attention sweep did not run: the private data store was unreachable."
          echo "Usually DATA_REPO_TOKEN has expired. The scan published without attention;"
          echo "coverage figures on the site are carrying forward from the last good sweep."
          exit 1

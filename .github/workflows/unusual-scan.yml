name: Publish Unusual Moves

# Scans the S&P 500 for stocks having unusual days and commits the result as a
# static JSON file, which the frontend fetches directly.
#
# Same reasoning as the Signal Desk workflow: the payload is identical for
# every viewer, so it is a file rather than a request. It also keeps a
# 503-ticker download off the critical path of somebody opening the page.

on:
  schedule:
    # Hourly during US market hours, plus once after the close, on weekdays.
    # The post-close run is the one that matters — it is the only scan of the
    # day that reads a completed session.
    - cron: '0 14-21 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# Only this workflow may write, and only to push the generated file.
permissions:
  contents: write

concurrency:
  group: unusual-scan
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The attention sweep paces itself to stay under Yahoo's limiter, so the
    # post-close run is minutes rather than seconds. Bounded so a hung request
    # cannot hold the runner open.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # The attention archive lives in a private repository. It is the only
      # thing here that cannot be rebuilt from public sources, and a public git
      # log would publish it daily — permanently, since history cannot be
      # un-shared. Only the derived figures reach snapshot.json.
      #
      # continue-on-error: a missing or expired token must not stop the price
      # scan, which is the actual product. The step below degrades to a scan
      # without attention.
      - name: Check out the private data store
        id: data_store
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Princ3k/quantimental-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-store

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Production deps only — no test runner needed to generate a file.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The news sweep takes about nine minutes and the archive keeps one
      # observation per trading day, so the eight hourly runs would spend the
      # same Yahoo budget overwriting the same row — and sweeping nine times a
      # day is how you get rate limited. Only the post-close run measures it.
      - name: Scan for unusual moves
        if: github.event.schedule != '30 21 * * 1-5'
        run: python scripts/publish_unusual.py ../public/unusual.json

      - name: Scan, and measure attention
        if: |
          (github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch')
          && steps.data_store.outcome == 'success'
        env:
          ATTENTION_ARCHIVE_PATH: ${{ github.workspace }}/data-store/attention-history.json
        run: python scripts/publish_unusual.py ../public/unusual.json --attention

      # The data store was unreachable — usually an expired token. Scan anyway;
      # coverage figures carry forward from the last successful sweep.
      - name: Scan without attention (data store unavailable)
        if: |
          (github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch')
          && steps.data_store.outcome != 'success'
        run: |
          echo "::warning::Private data store unreachable; skipping the attention sweep."
          python scripts/publish_unusual.py ../public/unusual.json

      - name: Commit the archive to its private store
        if: steps.data_store.outcome == 'success'
        working-directory: data-store
        run: |
          if git diff --quiet -- attention-history.json 2>/dev/null && \
             [ -z "$(git status --porcelain attention-history.json)" ]; then
            echo "Archive unchanged."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attention-history.json
          git commit -m "chore: attention readings for $(date -u +%Y-%m-%d)"
          git push

      - name: Commit if the scan changed
        working-directory: .
        run: |
          # snapshot.json carries every measured ticker and backs the per-stock
          # pages, so it changes on almost every run even when the feed does not.
          if git diff --quiet -- public/unusual.json public/snapshot.json; then
            echo "No change in the scan; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/unusual.json public/snapshot.json
          git commit -m "chore: update unusual moves [skip ci]"
          git push

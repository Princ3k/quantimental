name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the code. Nothing here publishes,
# comments, or touches releases, so nothing else is granted.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Check the app imports without a database or API keys
        # Guards the core promise that the API starts with nothing configured.
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  bot:
    name: Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # pytest.ini sets `pythonpath = .`, so the modules resolve without help
      # here — the bot is a flat package, not installed.
      - name: Run tests
        run: python -m pytest

      - name: Check the command tree builds without a token
        # The step that would have caught client methods accidentally nested
        # inside another function's body: valid Python, imports cleanly, and the
        # command is simply absent. A live smoke test found that, not the suite —
        # so the absence of a command is now something CI can see.
        run: |
          python - <<'EOF'
          import main

          names = sorted(command.name for command in main.bot.tree.get_commands())
          expected = {
              "filings", "help", "market", "misses",
              "my", "stats", "stock", "unusual", "watch",
          }
          missing = expected - set(names)
          assert not missing, f"commands missing from the tree: {sorted(missing)}"

          # The backstop is a decorator on a module-level function, which is the
          # kind of thing a refactor drops without any test noticing.
          handler = main.bot.tree.on_error.__name__
          assert handler == "on_command_error", f"error handler is {handler}"

          print(f"{len(names)} commands registered: {names}")
          EOF

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

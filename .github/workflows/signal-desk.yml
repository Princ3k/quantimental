name: Publish Signal Desk

# Recomputes the market read and commits it as a static JSON file, which the
# portfolio fetches directly from raw.githubusercontent.com.
#
# The payload is identical for every viewer and changes slowly, so it is a file
# rather than a request. This costs nothing, never cold-starts, and stays up
# even when nothing else is running.

on:
  schedule:
    # Every 30 minutes during US market hours (13:00-21:59 UTC), weekdays.
    # GitHub may delay scheduled runs under load; a few minutes of drift is
    # immaterial for a five-day lookback.
    # Off the hour and the half hour on purpose — see unusual-scan.yml. A
    # scheduled run GitHub drops is not retried, it is simply missing.
    - cron: '7,37 13-21 * * 1-5'
  workflow_dispatch:

# Only this workflow may write, and only to push the generated file.
permissions:
  contents: write

concurrency:
  group: signal-desk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Production deps only — no test runner needed to generate a file.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the Signal Desk
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/publish_signal_desk.py ../public/signal-desk.json

      - name: Commit if the reading changed
        working-directory: .
        run: |
          # The history file accumulates one record per day, so it changes even
          # when the headline reading does not.
          if git diff --quiet -- public/signal-desk.json public/signal-desk-history.json; then
            echo "No change in the market reading; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Named once. The same list is needed four times below, and the last
          # time a published file moved, four stale paths were left behind in a
          # workflow and the publish broke for days.
          #
          # Left unquoted where it expands: these word-split into separate
          # arguments, and none of the paths contain spaces.
          publish_files="public/signal-desk.json public/signal-desk-history.json"

          # Two publishers write this branch, and a scan can also race another
          # run of itself: github.sha is pinned when a run is created, so one
          # that queued behind another checks out a base that has already moved.
          #
          # The first attempt at this rebased, on the reasoning that the two
          # workflows write different files so nothing could conflict. That was
          # true across workflows and false for a workflow racing itself — both
          # runs regenerate the same file with a different timestamp, on the
          # same lines, and the rebase stopped on a conflict.
          #
          # These files are generated, never edited, so there is nothing to
          # merge. The newest scan is simply the one we want: take the freshest
          # main and replant our output on top of it.
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            git add $publish_files
            git commit -q -m "chore: update signal desk [skip ci]" || true

            if git push; then
              exit 0
            fi

            echo "::notice::Push rejected (attempt $attempt of 5); replanting on the newest main."

            # Somewhere a hard reset cannot reach.
            mkdir -p "$RUNNER_TEMP/publish"
            # shellcheck disable=SC2086
            for f in $publish_files; do
              cp "$f" "$RUNNER_TEMP/publish/$(basename "$f")"
            done

            # Guarded deliberately. GitHub runs these blocks under `bash -e`, so
            # an unguarded fetch that fails takes the whole step down with git's
            # own exit code instead of trying again — which is how this died
            # with 128 on 2026-10-05, while the identical race half an hour
            # earlier merely exhausted its attempts. A refused or interrupted
            # fetch is a reason to retry, not to stop publishing.
            if git fetch origin main && git reset --hard origin/main; then
              # shellcheck disable=SC2086
              for f in $publish_files; do
                mkdir -p "$(dirname "$f")"
                cp "$RUNNER_TEMP/publish/$(basename "$f")" "$f"
              done
            else
              echo "::notice::Could not reach origin (attempt $attempt); keeping this tree and retrying."
            fi

            # Backing off matters more than it looks. Both publishers push this
            # branch on overlapping schedules, and on 2026-10-05 a single push
            # was taking around 200 seconds; three immediate retries lose the
            # same race three times.
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1

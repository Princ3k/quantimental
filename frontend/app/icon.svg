<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Quantimental">
  <!--
    A reading that stops.

    Every other chart mark in this category ends in an arrowhead pointing off
    the canvas — the forecast. This one ends in a solid dot with nothing after
    it, because the product describes what happened and refuses to say what
    comes next. The empty right-hand third is the mark's whole argument, so
    do not fill it.

    Monochrome on purpose: green and red already mean "up today" and "down
    today" everywhere else in this interface, and a logo in either would take
    a directional position the product does not hold.

    The line and the dot get separate classes, and the line's `fill: none`
    lives in the CSS rather than in a fill="" attribute. This matters: CSS
    outranks presentation attributes, so a single class setting both stroke
    and fill silently overrode fill="none" and flooded the path — which
    renders as a solid wedge that looks uncannily like the Vercel logo. Keep
    the two properties apart.
  -->
  <style>
    .line { fill: none; stroke: #1c1b1a; }
    .dot  { fill: #1c1b1a; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #f4f3f1; }
      .dot  { fill: #f4f3f1; }
    }
  </style>
  <path class="line" d="M4 23 L10 17.5 L15.5 20.5 L24 11"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="dot" cx="24" cy="11" r="3.2" />
</svg>
